<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Player Statistics - APL Tournament</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.stats-container {
    max-width: 1100px;
    margin: auto;
}

.page-header {
    background: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.stats-icon {
    font-size: 50px;
}

.tournament-selector {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.tournament-selector label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
}

#tournamentSelect {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: white;
    font-size: 15px;
}

.player-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.player-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.player-avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.player-header h3 {
    margin: 0;
}

.player-header p {
    margin: 5px 0;
    color: #666;
}

.stats-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
}

.stat-box {
    background: #f8fafc;
    padding: 13px;
    border-radius: 10px;
    text-align: center;
}

.stat-box strong {
    display: block;
    font-size: 20px;
}

.stat-box span {
    font-size: 13px;
    color: #666;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

.player-status {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
}

.status-approved {
    background: #dcfce7;
    color: #166534;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
}

.status-rejected {
    background: #fee2e2;
    color: #991b1b;
}

</style>

</head>

<body>

<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Player Statistics
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>


<main class="home-container">

<div class="stats-container">


<!-- PAGE HEADER -->

<div class="page-header">

    <div class="stats-icon">
        📊
    </div>

    <h2>
        Player Statistics
    </h2>

    <p>
        Tournament Player Performance
    </p>

</div>


<!-- TOURNAMENT SELECTOR -->

<div class="tournament-selector">

    <label for="tournamentSelect">

        🏆 Select Tournament

    </label>

    <select id="tournamentSelect">

        <option value="">

            ⏳ Loading Tournaments...

        </option>

    </select>

</div>


<!-- TOURNAMENT INFO -->

<div
    id="tournamentInfo"
    class="page-header"
>

    ⏳ Loading Tournament...

</div>


<!-- PLAYERS -->

<div id="playersList">

    <div class="empty">

        ⏳ Loading Player Statistics...

    </div>

</div>


<br>


<div style="text-align:center;">

    <a
        id="backBtn"
        href="my-tournaments.html"
        class="btn"
    >

        ⬅ Back

    </a>

</div>


</div>

</main>


<footer>

<p>
🏏 APL Tournament Platform
</p>

</footer>


<!-- IMPORTANT:
     player-stats.js is inside js folder
-->

<script
    type="module"
    src="./js/player-stats.js"
></script>

</body>

</html>
