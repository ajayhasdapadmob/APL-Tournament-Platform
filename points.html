<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Points Table</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.points-container {
    max-width: 1000px;
    margin: auto;
}

.points-header {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.id-box {
    background: #eff6ff;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    word-break: break-all;
}

.table-box {
    background: white;
    padding: 15px;
    border-radius: 15px;
    overflow-x: auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.points-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.points-table th,
.points-table td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

.points-table th {
    background: #1e3a8a;
    color: white;
}

.points-table tr:hover {
    background: #f8fafc;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 15px;
}

.navigation {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Points Table
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>



<main class="home-container">


<div class="points-container">


    <div
        id="pointsHeader"
        class="points-header"
    >

        ⏳ Loading Tournament...

    </div>


    <h2>
        📈 Tournament Points Table
    </h2>


    <div class="table-box">

        <table class="points-table">

            <thead>

                <tr>

                    <th>Pos</th>

                    <th>Team</th>

                    <th>P</th>

                    <th>W</th>

                    <th>L</th>

                    <th>NR</th>

                    <th>Pts</th>

                    <th>NRR</th>

                </tr>

            </thead>

            <tbody id="pointsBody">

                <tr>

                    <td
                        colspan="8"
                    >
                        ⏳ Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <div class="navigation">


        <a
            id="tournamentLink"
            href="#"
            class="btn"
        >
            🏆 Tournament
        </a>


        <a
            id="teamsLink"
            href="#"
            class="btn"
        >
            👥 Teams
        </a>


        <a
            id="scheduleLink"
            href="#"
            class="btn"
        >
            📅 Schedule
        </a>


        <a
            id="resultsLink"
            href="#"
            class="btn"
        >
            🏆 Results
        </a>


        <a
            id="liveScoreLink"
            href="#"
            class="btn"
        >
            🔴 Live Score
        </a>


        <a
            href="my-tournaments.html"
            class="btn"
        >
            ⬅ My Tournaments
        </a>


    </div>


</div>


</main>



<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>



<script
    type="module"
    src="js/points.js"
></script>


</body>

</html>
