<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Organizer Account - APL</title>

<link rel="stylesheet"
      href="./css/style.css">

</head>

<body>

<header class="app-header">

    <div class="app-logo">
        🏏
    </div>

    <div class="app-title">

        <h1>
            APL Tournament Platform
        </h1>

        <span>
            Organizer Account
        </span>

    </div>

</header>


<main class="app-container">

<section class="welcome-card">

    <div class="welcome-small">
        🏆 APL Tournament Platform
    </div>

    <h2>
        Create Organizer Account
    </h2>

    <p>
        Create your account to create and manage tournaments.
    </p>

</section>


<section class="registered-header">

    <h2>
        📝 Create Account
    </h2>

    <p>
        Enter your details below.
    </p>


    <form id="registerForm">

        <div style="margin-bottom:15px;">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
                style="
                    width:100%;
                    padding:13px;
                    margin-top:7px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    font-size:15px;
                "
            >

        </div>


        <div style="margin-bottom:15px;">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email address"
                required
                style="
                    width:100%;
                    padding:13px;
                    margin-top:7px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    font-size:15px;
                "
            >

        </div>


        <div style="margin-bottom:15px;">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
                style="
                    width:100%;
                    padding:13px;
                    margin-top:7px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    font-size:15px;
                "
            >

        </div>


        <div style="margin-bottom:15px;">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                required
                style="
                    width:100%;
                    padding:13px;
                    margin-top:7px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    font-size:15px;
                "
            >

        </div>


        <button
            type="submit"
            id="registerBtn"
            class="btn primary-btn"
            style="
                width:100%;
                cursor:pointer;
            "
        >
            📝 Create Account
        </button>

    </form>


    <p
        id="message"
        style="
            margin-top:15px;
            font-weight:bold;
            text-align:center;
        "
    ></p>


    <div style="
        text-align:center;
        margin-top:20px;
    ">

        <p>
            Already have an account?
        </p>

        <a
            href="./login.html"
            class="btn"
        >
            🔐 Login
        </a>

    </div>

</section>

</main>


<script
    type="module"
    src="./js/register.js?v=1"
></script>

</body>

</html>
