<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Create Tournament</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.form-container {

    max-width: 850px;

    margin: auto;

}


.form-card {

    background: white;

    padding: 25px;

    border-radius: 16px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.form-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 15px;

}


.form-group {

    margin-bottom: 12px;

}


.form-group.full {

    grid-column: 1 / -1;

}


.form-group label {

    display: block;

    font-weight: bold;

    margin-bottom: 6px;

}


.form-group input,
.form-group select,
.form-group textarea {

    width: 100%;

    box-sizing: border-box;

    padding: 12px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 15px;

}


.form-group textarea {

    min-height: 120px;

    resize: vertical;

}


.submit-btn {

    width: 100%;

    margin-top: 20px;

    padding: 14px;

    border: none;

    border-radius: 9px;

    font-size: 17px;

    cursor: pointer;

}


.note {

    margin-top: 15px;

    padding: 12px;

    background: #eff6ff;

    border-radius: 8px;

    color: #1e40af;

}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Create Tournament
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>



<main class="home-container">


<div class="form-container">


<div class="form-card">


<h2>
    🏆 Tournament Information
</h2>


<p class="note">

    Tournament ID Firebase automatically
    generate करेगा। इसी ID का इस्तेमाल
    Schedule, Match, Score, Results और
    Points Table में होगा।

</p>



<form
    id="tournamentForm"
>


<div class="form-grid">


    <div class="form-group full">

        <label>
            Tournament Name
        </label>

        <input
            type="text"
            id="tournamentName"
            placeholder="Example: APL 2026"
            required
        >

    </div>



    <div class="form-group">

        <label>
            Venue
        </label>

        <input
            type="text"
            id="venue"
            placeholder="Example: Padmabil Ground"
            required
        >

    </div>



    <div class="form-group">

        <label>
            Start Date
        </label>

        <input
            type="date"
            id="startDate"
            required
        >

    </div>



    <div class="form-group">

        <label>
            End Date
        </label>

        <input
            type="date"
            id="endDate"
            required
        >

    </div>



    <div class="form-group">

        <label>
            Total Teams
        </label>

        <input
            type="number"
            id="totalTeams"
            min="2"
            placeholder="23"
        >

    </div>



    <div class="form-group">

        <label>
            Entry Fee ₹
        </label>

        <input
            type="number"
            id="entryFee"
            min="0"
            placeholder="5000"
        >

    </div>



    <div class="form-group">

        <label>
            Winner Prize ₹
        </label>

        <input
            type="number"
            id="winnerPrize"
            min="0"
            placeholder="40000"
        >

    </div>



    <div class="form-group">

        <label>
            Runner-up Prize ₹
        </label>

        <input
            type="number"
            id="runnerPrize"
            min="0"
            placeholder="15000"
        >

    </div>



    <div class="form-group">

        <label>
            Tournament Format
        </label>

        <select id="format">

            <option value="League">
                League
            </option>

            <option value="Knockout">
                Knockout
            </option>

            <option value="League + Knockout">
                League + Knockout
            </option>

        </select>

    </div>



    <div class="form-group">

        <label>
            Contact Number
        </label>

        <input
            type="tel"
            id="contact"
            placeholder="Contact number"
        >

    </div>



    <div class="form-group">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Email address"
        >

    </div>



    <div class="form-group full">

        <label>
            Description
        </label>

        <textarea
            id="description"
            placeholder="Tournament details..."
        ></textarea>

    </div>


</div>



<button
    type="submit"
    class="btn primary-btn submit-btn"
>

    🏆 Create Tournament

</button>


</form>


<br>


<div style="text-align:center;">

    <a
        href="my-tournaments.html"
        class="btn"
    >

        ⬅ My Tournaments

    </a>

</div>


</div>


</div>


</main>



<footer>

<p>
    🏏 APL Tournament Platform
</p>

</footer>



<script
    type="module"
    src="js/create-tournament.js"
></script>


</body>

</html>
