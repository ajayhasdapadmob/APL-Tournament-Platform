<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - APL Tournament Platform</title>

<link rel="stylesheet" href="css/style.css">

<style>

.admin-container {
    max-width: 1100px;
    margin: auto;
}

.admin-header {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

#tournamentSelect {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.stat-card h2 {
    margin: 8px 0 0;
    font-size: 28px;
}

.team-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.team-card h3 {
    margin-top: 0;
}

.team-card p {
    margin: 8px 0;
}

.players-box {
    background: #f8fafc;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.status {
    font-weight: bold;
    padding: 10px;
    border-radius: 7px;
    background: #f3f4f6;
}

.action-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 15px;
}

.action-buttons button {
    padding: 9px 12px;
    border: none;
    border-radius: 7px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.pending-btn { background: #d97706; }
.approved-btn { background: #059669; }
.rejected-btn { background: #dc2626; }
.paid-btn { background: #047857; }
.hold-btn { background: #7c3aed; }
.cancel-btn { background: #4b5563; }
.delete-btn { background: #991b1b; }

.empty {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

#adminMessage {
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.loading {
    background: #fef3c7;
    color: #92400e;
}

</style>

</head>

<body>

<header class="top-header">

    <div class="logo">🏏</div>

    <div>
        <h1>Admin Panel</h1>
        <p>APL Tournament Platform</p>
    </div>

</header>


<main class="home-container">

<div class="admin-container">


<div class="admin-header">

    <h2>⚙️ Tournament Management</h2>

    <p>Select a tournament to manage registered teams.</p>

    <select id="tournamentSelect">

        <option value="">
            -- Select Tournament --
        </option>

    </select>

</div>


<div id="adminMessage"></div>


<div class="stats">


    <div class="stat-card">
        👥 Total Teams
        <h2 id="totalTeams">0</h2>
    </div>


    <div class="stat-card">
        ⏳ Pending
        <h2 id="pendingTeams">0</h2>
    </div>


    <div class="stat-card">
        ✅ Approved
        <h2 id="approvedTeams">0</h2>
    </div>


    <div class="stat-card">
        ❌ Rejected
        <h2 id="rejectedTeams">0</h2>
    </div>


    <div class="stat-card">
        💰 Paid
        <h2 id="paidTeams">0</h2>
    </div>


    <div class="stat-card">
        ⏸️ On Hold
        <h2 id="holdTeams">0</h2>
    </div>


    <div class="stat-card">
        🚫 Cancelled
        <h2 id="cancelledTeams">0</h2>
    </div>


</div>


<div id="teamList">

    <div class="empty">
        ⏳ Loading...
    </div>

</div>


<br>


<div style="text-align:center;">

    <a href="dashboard.html" class="btn">
        ⬅ Dashboard
    </a>

    <a href="my-tournaments.html" class="btn">
        🏆 My Tournaments
    </a>

</div>


</div>

</main>


<footer>

<p>
    🏏 APL Tournament Platform
</p>

</footer>


<script type="module" src="js/admin.js"></script>

</body>

</html>
