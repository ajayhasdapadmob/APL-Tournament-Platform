<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tournament Schedule - APL Tournament Platform</title>

<link
    rel="stylesheet"
    href="./css/style.css"
>

<style>

.schedule-container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px 14px 90px;
}

.tournament-selector {
    background: white;
    padding: 18px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.tournament-selector label {
    display: block;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 8px;
}

#tournamentSelect {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    background: white;
    color: #0f172a;
    outline: none;
}

#tournamentSelect:focus {
    border-color: #2563eb;
}

.tournament-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.tournament-card h2 {
    color: #1e3a8a;
    margin-bottom: 10px;
}

.tournament-card p {
    margin: 7px 0;
}

.schedule-title {
    color: white;
    margin-bottom: 15px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.6);
}

.match-list {
    display: grid;
    gap: 15px;
}

.match-card {
    background: white;
    padding: 18px;
    border-radius: 17px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.match-card h3 {
    color: #1e3a8a;
    margin-bottom: 12px;
}

.match-card p {
    margin: 7px 0;
    color: #334155;
}

.match-status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;
    background: #dbeafe;
    color: #1e40af;
    font-weight: bold;
    margin-top: 8px;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    color: #475569;
}

.navigation {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 25px;
}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>Tournament Schedule</h1>

        <p>APL Tournament Platform</p>

    </div>

</header>


<main class="schedule-container">


    <!-- ====================================
         TOURNAMENT DROPDOWN
    ===================================== -->

    <div class="tournament-selector">

        <label for="tournamentSelect">
            🏆 Select Tournament
        </label>

        <select id="tournamentSelect">

            <option value="">
                ⏳ Loading Tournaments...
            </option>

        </select>

    </div>


    <!-- ====================================
         TOURNAMENT INFORMATION
    ===================================== -->

    <div class="tournament-card">

        <h2 id="tournamentName">
            ⏳ Loading Tournament...
        </h2>

        <p>
            🆔
            <b>Tournament ID:</b>
            <span id="tournamentId">
                -
            </span>
        </p>

        <p>
            📍
            <b>Venue:</b>
            <span id="venue">
                -
            </span>
        </p>

    </div>


    <!-- ====================================
         SCHEDULE
    ===================================== -->

    <h2 class="schedule-title">
        📅 Match Schedule
    </h2>


    <div
        id="matchList"
        class="match-list"
    >

        <div class="empty">
            ⏳ Loading Matches...
        </div>

    </div>


    <!-- ====================================
         NAVIGATION
    ===================================== -->

    <div class="navigation">

        <a
            id="tournamentLink"
            href="#"
            class="btn"
        >
            🏆 Tournament
        </a>


        <a
            id="resultsLink"
            href="#"
            class="btn"
        >
            🏆 Results
        </a>


        <a
            id="pointsLink"
            href="#"
            class="btn"
        >
            📈 Points Table
        </a>


        <a
            id="liveLink"
            href="#"
            class="btn"
        >
            🔴 Live Score
        </a>


        <a
            href="my-tournaments.html"
            class="btn"
        >
            ⬅ My Tournaments
        </a>

    </div>


</main>


<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>


<script
    type="module"
    src="./js/schedule.js?v=2"
></script>


</body>

</html>
