<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tournament Contact</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.contact-container {

    max-width: 850px;

    margin: auto;

}


.contact-card {

    background: white;

    padding: 25px;

    border-radius: 16px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.tournament-header {

    background: #eff6ff;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 20px;

}


.tournament-id {

    margin-top: 8px;

    word-break: break-all;

    font-size: 14px;

}


.contact-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 15px;

}


.contact-item {

    background: #f8fafc;

    padding: 18px;

    border-radius: 10px;

}


.contact-item b {

    display: block;

    margin-bottom: 7px;

}


.contact-item a {

    text-decoration: none;

}


.navigation {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    justify-content: center;

    margin-top: 22px;

}


.empty {

    background: white;

    padding: 30px;

    border-radius: 15px;

    text-align: center;

}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Tournament Contact
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>



<main class="home-container">


<div class="contact-container">


    <div
        id="contactCard"
        class="contact-card"
    >

        <div class="empty">

            ⏳ Loading Tournament...

        </div>

    </div>


    <div class="navigation">


        <a
            id="tournamentLink"
            href="#"
            class="btn"
        >

            🏆 Tournament

        </a>


        <a
            id="scheduleLink"
            href="#"
            class="btn"
        >

            📅 Schedule

        </a>


        <a
            id="resultsLink"
            href="#"
            class="btn"
        >

            🏆 Results

        </a>


        <a
            id="liveScoreLink"
            href="#"
            class="btn"
        >

            🔴 Live Score

        </a>


        <a
            id="pointsLink"
            href="#"
            class="btn"
        >

            📈 Points Table

        </a>


    </div>


</div>


</main>



<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>



<script
    type="module"
    src="js/contact.js"
></script>


</body>

</html>
