<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Match - APL Tournament Platform</title>

<link rel="stylesheet"
      href="./css/style.css">

<style>

body {
    background: #f1f5f9;
    margin: 0;
    font-family: Arial, sans-serif;
}

.match-container {
    max-width: 850px;
    margin: auto;
    padding: 20px 14px 100px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.card h2 {
    color: #1e3a8a;
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 15px;
    background: white;
}

.team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.create-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.create-btn:disabled {
    opacity: .6;
}

.message {
    display: none;
    padding: 13px;
    margin-top: 15px;
    border-radius: 10px;
    text-align: center;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.tournament-info {
    background: #eff6ff;
    padding: 14px;
    border-radius: 10px;
    color: #1e40af;
}

.navigation {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.navigation a {
    text-decoration: none;
}

@media(max-width:600px) {

    .team-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>Create Match</h1>

        <p>APL Tournament Platform</p>

    </div>

</header>



<main class="match-container">


    <!-- TOURNAMENT -->

    <section class="card">

        <h2>🏆 Tournament</h2>

        <div
            id="tournamentInfo"
            class="tournament-info"
        >

            ⏳ Loading Tournament...

        </div>

    </section>



    <!-- CREATE MATCH -->

    <section class="card">

        <h2>🏏 Match Information</h2>


        <form id="matchForm">


            <div class="form-group">

                <label>
                    Match Number
                </label>

                <input
                    type="number"
                    id="matchNumber"
                    min="1"
                    placeholder="Example: 1"
                    required
                >

            </div>



            <div class="team-grid">


                <div class="form-group">

                    <label>
                        🏏 Team 1
                    </label>

                    <select
                        id="team1"
                        required
                    >

                        <option value="">
                            ⏳ Loading Teams...
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label>
                        🏏 Team 2
                    </label>

                    <select
                        id="team2"
                        required
                    >

                        <option value="">
                            ⏳ Loading Teams...
                        </option>

                    </select>

                </div>


            </div>



            <div class="form-group">

                <label>
                    📅 Match Date
                </label>

                <input
                    type="date"
                    id="matchDate"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    ⏰ Match Time
                </label>

                <input
                    type="time"
                    id="matchTime"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    📍 Venue
                </label>

                <input
                    type="text"
                    id="matchVenue"
                    placeholder="Match venue"
                >

            </div>



            <div class="form-group">

                <label>
                    📊 Match Status
                </label>

                <select id="status">

                    <option value="Scheduled">
                        Scheduled
                    </option>

                    <option value="Live">
                        Live
                    </option>

                </select>

            </div>



            <button
                type="submit"
                id="createMatchBtn"
                class="create-btn"
            >

                🏏 Create Match

            </button>


        </form>



        <div
            id="message"
            class="message"
        ></div>


    </section>



    <!-- NAVIGATION -->

    <div class="navigation">

        <a
            id="scheduleLink"
            href="#"
            class="btn"
        >
            📅 Schedule
        </a>


        <a
            id="liveLink"
            href="#"
            class="btn"
        >
            🔴 Live Score
        </a>


        <a
            href="my-tournaments.html"
            class="btn"
        >
            🏆 My Tournaments
        </a>

    </div>


</main>



<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>



<script
    type="module"
    src="./js/create-match.js?v=1"
></script>


</body>

</html>
