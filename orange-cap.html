<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Orange Cap - APL Tournament</title>

<link rel="stylesheet" href="css/style.css">

<style>

.orange-container {
    max-width: 1000px;
    margin: auto;
}

.page-header,
.tournament-selector,
.orange-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.page-header {
    padding: 25px;
    text-align: center;
    margin-bottom: 20px;
}

.orange-icon {
    font-size: 65px;
}

.tournament-selector {
    padding: 20px;
    margin-bottom: 20px;
}

.tournament-selector label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

#tournamentSelect {
    width: 100%;
    padding: 14px;
    border: 1px solid #2563eb;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.orange-card {
    padding: 30px;
    text-align: center;
    border-top: 6px solid #f97316;
    margin-bottom: 20px;
}

.player-avatar {
    width: 80px;
    height: 80px;
    margin: auto;
    border-radius: 50%;
    background: #fff7ed;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.player-name {
    font-size: 28px;
    font-weight: bold;
    margin-top: 15px;
}

.team-name {
    color: #64748b;
    font-size: 17px;
    margin-top: 5px;
}

.runs {
    font-size: 48px;
    font-weight: bold;
    color: #f97316;
    margin-top: 20px;
}

.runs-label {
    color: #64748b;
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 20px;
}

.stat-box {
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
}

.stat-box strong {
    display: block;
    font-size: 22px;
}

.stat-box span {
    color: #64748b;
    font-size: 13px;
}

.status {
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-top: 20px;
}

.navigation {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Orange Cap
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>


<main class="home-container">

<div class="orange-container">


<!-- TOURNAMENT SELECTOR -->

<div class="tournament-selector">

    <label for="tournamentSelect">

        🏆 Select Tournament

    </label>

    <select id="tournamentSelect">

        <option value="">
            ⏳ Loading Tournaments...
        </option>

    </select>

</div>


<!-- TOURNAMENT INFORMATION -->

<div
    id="tournamentInfo"
    class="page-header"
>

    ⏳ Loading Tournament...

</div>


<!-- ORANGE CAP -->

<div class="orange-card">

    <div class="orange-icon">
        🟠
    </div>

    <h2>
        Orange Cap
    </h2>

    <p>
        🏏 Highest Run Scorer
    </p>


    <div class="player-avatar">
        👤
    </div>


    <div
        id="playerName"
        class="player-name"
    >
        Loading...
    </div>


    <div
        id="teamName"
        class="team-name"
    >
        -
    </div>


    <div
        id="runs"
        class="runs"
    >
        0
    </div>


    <div class="runs-label">
        TOTAL RUNS
    </div>


    <div class="stats">

        <div class="stat-box">

            <strong id="matches">
                0
            </strong>

            <span>
                Matches
            </span>

        </div>


        <div class="stat-box">

            <strong id="wickets">
                0
            </strong>

            <span>
                Wickets
            </span>

        </div>


    </div>

</div>


<div
    id="statusMessage"
    class="status"
>

    ⏳ Loading Player Statistics...

</div>


<!-- NAVIGATION -->

<div class="navigation">

    <a
        id="pointsLink"
        href="#"
        class="btn"
    >
        📈 Points Table
    </a>

    <a
        id="purpleLink"
        href="#"
        class="btn"
    >
        🟣 Purple Cap
    </a>

    <a
        href="my-tournaments.html"
        class="btn"
    >
        ⬅ My Tournaments
    </a>

</div>


</div>

</main>


<footer>

<p>
🏏 APL Tournament Platform
</p>

</footer>


<script
    type="module"
    src="./js/orange-cap.js"
></script>


</body>

</html>
