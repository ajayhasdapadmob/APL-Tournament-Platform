<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Team Registration - APL Tournament Platform</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.registration-card {

    max-width: 650px;

    margin: 30px auto;

    background: white;

    padding: 25px;

    border-radius: 16px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.tournament-info {

    background: #eff6ff;

    border: 1px solid #bfdbfe;

    padding: 16px;

    border-radius: 12px;

    margin-bottom: 22px;

}


.tournament-info p {

    margin: 7px 0;

}


.form-group {

    margin-bottom: 16px;

}


.form-group label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

}


.form-group input,
.form-group textarea {

    width: 100%;

    padding: 13px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 15px;

    box-sizing: border-box;

}


.form-group input:focus,
.form-group textarea:focus {

    outline: none;

    border-color: #2563eb;

}


.form-group textarea {

    min-height: 120px;

    resize: vertical;

}


.readonly-input {

    background: #f3f4f6;

}


.players-help {

    font-size: 13px;

    color: #6b7280;

    margin-top: 5px;

}


#message {

    margin-top: 18px;

    padding: 12px;

    border-radius: 8px;

    font-weight: bold;

    text-align: center;

}


.buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 20px;

}


.submit-btn {

    border: none;

    cursor: pointer;

}


.submit-btn:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Team Registration
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="home-container">


<div class="registration-card">


<h2>
    👥 Register Your Team
</h2>


<!-- =========================
     TOURNAMENT INFORMATION
========================= -->

<div class="tournament-info">

    <p>
        🏆 <b>Tournament:</b>
        <span id="tournamentDisplay">
            Loading...
        </span>
    </p>


    <p>
        📍 <b>Venue:</b>
        <span id="venueDisplay">
            Loading...
        </span>
    </p>


    <p>
        🆔 <b>Tournament ID:</b>
        <span id="tournamentIdDisplay">
            Loading...
        </span>
    </p>

</div>



<!-- =========================
     REGISTRATION FORM
========================= -->

<form id="registrationForm">


<!-- TOURNAMENT NAME -->

<div class="form-group">

<label>
    🏆 Tournament Name
</label>

<input
    type="text"
    id="tournamentName"
    placeholder="Tournament Name"
    class="readonly-input"
    readonly
    required
>

</div>



<!-- VENUE -->

<div class="form-group">

<label>
    📍 Venue
</label>

<input
    type="text"
    id="venue"
    placeholder="Venue"
    class="readonly-input"
    readonly
    required
>

</div>



<!-- TEAM NAME -->

<div class="form-group">

<label>
    🏏 Team Name
</label>

<input
    type="text"
    id="teamName"
    placeholder="Enter Team Name"
    required
>

</div>



<!-- CAPTAIN -->

<div class="form-group">

<label>
    👤 Captain Name
</label>

<input
    type="text"
    id="captainName"
    placeholder="Captain Name"
    required
>

</div>



<!-- MOBILE -->

<div class="form-group">

<label>
    📞 Mobile Number
</label>

<input
    type="tel"
    id="mobile"
    placeholder="Mobile Number"
    inputmode="numeric"
    required
>

</div>



<!-- EMAIL -->

<div class="form-group">

<label>
    📧 Email
</label>

<input
    type="email"
    id="email"
    placeholder="Email Address"
>

</div>



<!-- CITY -->

<div class="form-group">

<label>
    🏙️ City
</label>

<input
    type="text"
    id="city"
    placeholder="City"
    required
>

</div>



<!-- PLAYERS -->

<div class="form-group">

<label>
    👥 Player Names
</label>

<textarea
    id="players"
    placeholder="Ajay, Rahul, Rohit, Amit, Suresh"
    required
></textarea>

<p class="players-help">
    Enter player names separated by commas.
</p>

</div>



<!-- =========================
     BUTTONS
========================= -->

<div class="buttons">

<button
    type="submit"
    class="btn primary-btn submit-btn"
>
    🏏 Register Team
</button>


<a
    href="javascript:history.back()"
    class="btn"
>
    ⬅ Back
</a>

</div>


</form>



<!-- =========================
     MESSAGE
========================= -->

<p id="message"></p>


</div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

<p>
    🏏 APL Tournament Platform
</p>

</footer>



<!-- =========================
     REGISTRATION JAVASCRIPT
========================= -->

<script
    type="module"
    src="js/registration.js"
></script>


</body>

</html>
