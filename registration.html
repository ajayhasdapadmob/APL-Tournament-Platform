<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Team Registration - APL Tournament Platform</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.registration-container {
    max-width: 700px;
    margin: auto;
}

.registration-card {
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.tournament-info {
    background: #eff6ff;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 22px;
}

.tournament-info p {
    margin: 7px 0;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}

.form-group input[readonly] {
    background: #f3f4f6;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.submit-btn {
    flex: 1;
    min-width: 180px;
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    display: none;
}

.success-message {
    display: block !important;
    background: #dcfce7;
    color: #166534;
}

.error-message {
    display: block !important;
    background: #fee2e2;
    color: #991b1b;
}

.loading-message {
    display: block !important;
    background: #fef3c7;
    color: #92400e;
}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Team Registration
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>


<main class="home-container">

<div class="registration-container">

<div class="registration-card">


<h2>
    👥 Register Your Team
</h2>


<!-- =========================
     TOURNAMENT INFORMATION
========================= -->

<div class="tournament-info">

    <p>
        🏆 <b>Tournament:</b>
        <span id="tournamentDisplay">
            Loading...
        </span>
    </p>

    <p>
        📍 <b>Venue:</b>
        <span id="venueDisplay">
            Loading...
        </span>
    </p>

    <p>
        🆔 <b>Tournament ID:</b>
        <span id="tournamentIdDisplay">
            Loading...
        </span>
    </p>

</div>


<!-- =========================
     REGISTRATION FORM
========================= -->

<form
    id="registrationForm"
    novalidate
>


<!-- TOURNAMENT NAME -->

<div class="form-group">

<label>
    🏆 Tournament Name
</label>

<input
    type="text"
    id="tournamentName"
    readonly
    required
>

</div>


<!-- VENUE -->

<div class="form-group">

<label>
    📍 Venue
</label>

<input
    type="text"
    id="venue"
    readonly
    required
>

</div>


<!-- TEAM NAME -->

<div class="form-group">

<label>
    🏏 Team Name
</label>

<input
    type="text"
    id="teamName"
    placeholder="Enter Team Name"
    autocomplete="organization"
    required
>

</div>


<!-- CAPTAIN -->

<div class="form-group">

<label>
    👤 Captain Name
</label>

<input
    type="text"
    id="captainName"
    placeholder="Enter Captain Name"
    autocomplete="name"
    required
>

</div>


<!-- MOBILE -->

<div class="form-group">

<label>
    📞 Mobile Number
</label>

<input
    type="tel"
    id="mobile"
    placeholder="Enter Mobile Number"
    inputmode="numeric"
    autocomplete="tel"
    required
>

</div>


<!-- EMAIL -->

<div class="form-group">

<label>
    📧 Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter Email Address"
    autocomplete="email"
>

</div>


<!-- CITY -->

<div class="form-group">

<label>
    🏙️ City
</label>

<input
    type="text"
    id="city"
    placeholder="Enter City"
    autocomplete="address-level2"
    required
>

</div>


<!-- PLAYERS -->

<div class="form-group">

<label>
    👥 Player Names
</label>

<textarea
    id="players"
    placeholder="Example: Ajay, Rahul, Rohit, Amit"
    required
></textarea>

<small>
    Player names को comma (,) से अलग करें।
</small>

</div>


<!-- BUTTONS -->

<div class="buttons">

<button
    type="submit"
    id="submitButton"
    class="btn primary-btn submit-btn"
    disabled
>
    ⏳ Loading Tournament...
</button>


<a
    href="javascript:history.back()"
    class="btn"
>
    ⬅ Back
</a>

</div>


</form>


<!-- =========================
     MESSAGE
========================= -->

<div
    id="message"
></div>


</div>

</div>

</main>


<footer>

<p>
    🏏 APL Tournament Platform
</p>

</footer>


<!-- =========================
     REGISTRATION JS
========================= -->

<script
    type="module"
    src="js/registration.js"
></script>


</body>

</html>
