<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - APL Tournament Platform</title>

    <link
        rel="stylesheet"
        href="./css/profile.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="profile-header">

    <div class="profile-logo">
        🏏
    </div>

    <div>

        <h1>
            My Profile
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="profile-container">


    <!-- =====================================
         PROFILE CARD
    ====================================== -->

    <section class="profile-card">


        <div class="avatar">
            👤
        </div>


        <h2 id="profileName">
            Organizer
        </h2>


        <p id="profileEmail">
            Loading email...
        </p>


    </section>



    <!-- =====================================
         PERSONAL INFORMATION
    ====================================== -->

    <section class="info-card">


        <h2>
            👤 Personal Information
        </h2>


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >



        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Email"
            readonly
        >



        <label for="mobile">
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter mobile number"
        >



        <label for="city">
            City
        </label>

        <input
            type="text"
            id="city"
            placeholder="Enter city"
        >



        <label for="organization">
            Organization / Club
        </label>

        <input
            type="text"
            id="organization"
            placeholder="Enter organization or club"
        >



        <button
            type="button"
            id="saveProfileBtn"
            class="save-btn"
        >

            💾 Save Profile

        </button>


        <p id="message"></p>


    </section>



    <!-- =====================================
         ACCOUNT INFORMATION
    ====================================== -->

    <section class="info-card">


        <h2>
            🔐 Account
        </h2>


        <p>

            <b>
                Account Status:
            </b>

            <span id="accountStatus">
                Active
            </span>

        </p>


        <p>

            <b>
                User ID:
            </b>

            <span id="userId">
                Loading...
            </span>

        </p>


    </section>



    <!-- =====================================
         ACTIONS
    ====================================== -->

    <section class="actions">


        <a
            href="./dashboard.html"
            class="back-btn"
        >

            ⬅ Dashboard

        </a>


        <button
            type="button"
            id="logoutBtn"
            class="logout-btn"
        >

            🚪 Logout

        </button>


    </section>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script
    type="module"
    src="./js/profile.js">
</script>


</body>

</html>
