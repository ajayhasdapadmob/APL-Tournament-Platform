<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Organizer Login</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>
        <h1>APL Tournament Platform</h1>
        <p>Organizer Login</p>
    </div>

</header>


<main class="home-container">


<section class="hero">


<h2>
🔐 Organizer Login
</h2>


<p>
Login to create and manage your
cricket tournaments.
</p>


<br>


<form id="loginForm">


<input
    type="email"
    id="email"
    placeholder="Email Address"
    required
    style="
        width:100%;
        max-width:450px;
        padding:13px;
        margin:8px auto;
        border:1px solid #d1d5db;
        border-radius:8px;
        display:block;
    "
>


<input
    type="password"
    id="password"
    placeholder="Password"
    required
    style="
        width:100%;
        max-width:450px;
        padding:13px;
        margin:8px auto;
        border:1px solid #d1d5db;
        border-radius:8px;
        display:block;
    "
>


<button
    type="submit"
    class="btn primary-btn"
>
    🔐 Login
</button>


</form>


<p
    id="message"
    style="margin-top:15px;"
></p>


<br>


<p>
Don't have an account?
</p>


<a
    href="register.html"
    class="btn"
>
    📝 Create Account
</a>


</section>


</main>


<script
    type="module"
    src="js/login.js"
></script>


</body>

</html>
