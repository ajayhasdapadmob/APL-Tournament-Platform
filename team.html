<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Teams - APL Tournament Platform</title>

<link
    rel="stylesheet"
    href="./css/style.css"
>

<style>

.teams-container {
    max-width: 900px;
    margin: auto;
    padding: 20px 14px 100px;
}

.tournament-box {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.tournament-box h2 {
    margin: 0 0 12px;
    color: #1e3a8a;
}

.tournament-box p {
    margin: 7px 0;
}

.team-count {
    background: #eff6ff;
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
    font-weight: bold;
}

#teamList {
    display: grid;
    gap: 14px;
}

.team-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.team-card h3 {
    color: #1e3a8a;
    margin-top: 0;
}

.team-card p {
    margin: 8px 0;
    color: #334155;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 7px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
}

.message {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.navigation {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.navigation a {
    text-decoration: none;
}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Teams
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>


<main class="teams-container">


    <!-- TOURNAMENT -->

    <section class="tournament-box">

        <h2 id="tournamentName">
            Loading Tournament...
        </h2>

        <p>
            🆔
            <b>Tournament ID:</b>
            <span id="tournamentId">
                -
            </span>
        </p>

        <p>
            📍
            <b>Venue:</b>
            <span id="venue">
                -
            </span>
        </p>

        <div class="team-count">

            👥 Registered Teams:
            <span id="totalTeams">
                0
            </span>

        </div>

    </section>


    <!-- TEAM LIST -->

    <section>

        <div id="teamList">

            <div class="message">

                ⏳ Loading Teams...

            </div>

        </div>

    </section>


    <!-- NAVIGATION -->

    <div class="navigation">

        <a
            id="tournamentLink"
            href="#"
            class="btn"
        >
            🏆 Tournament
        </a>


        <a
            id="registrationLink"
            href="#"
            class="btn"
        >
            🏏 Register Team
        </a>


        <a
            id="scheduleLink"
            href="#"
            class="btn"
        >
            📅 Schedule
        </a>


        <a
            id="pointsLink"
            href="#"
            class="btn"
        >
            📊 Points Table
        </a>

    </div>


</main>


<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>


<script
    type="module"
    src="./js/team.js?v=2"
></script>


</body>

</html>
