<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Teams - APL Tournament Platform</title>

<link
    rel="stylesheet"
    href="./css/style.css"
>

<style>

.teams-container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.tournament-card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.tournament-card h2 {
    color: #1e3a8a;
    margin-bottom: 12px;
}

.tournament-card p {
    margin: 8px 0;
}

.team-list {
    display: grid;
    gap: 15px;
}

.team-card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.team-card h3 {
    color: #1e3a8a;
    margin-bottom: 12px;
}

.team-card p {
    margin: 7px 0;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
    margin-top: 8px;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
}

.navigation {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>Teams</h1>

        <p>APL Tournament Platform</p>

    </div>

</header>


<main class="home-container">

<div class="teams-container">


    <!-- TOURNAMENT INFORMATION -->

    <div class="tournament-card">

        <h2 id="tournamentName">
            Loading Tournament...
        </h2>

        <p>
            🆔 <b>Tournament ID:</b>
            <span id="tournamentId">
                -
            </span>
        </p>

        <p>
            📍 <b>Venue:</b>
            <span id="venue">
                -
            </span>
        </p>

        <p>
            👥 <b>Registered Teams:</b>
            <span id="totalTeams">
                0
            </span>
        </p>

    </div>


    <!-- TEAM LIST -->

    <div
        id="teamList"
        class="team-list"
    >

        <div class="empty">
            ⏳ Loading Teams...
        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <a
            id="tournamentLink"
            href="#"
            class="btn"
        >
            🏆 Tournament
        </a>


        <a
            id="registrationLink"
            href="#"
            class="btn"
        >
            🏏 Register Team
        </a>


        <a
            id="scheduleLink"
            href="#"
            class="btn"
        >
            📅 Schedule
        </a>


        <a
            id="pointsLink"
            href="#"
            class="btn"
        >
            📊 Points Table
        </a>

    </div>


</div>

</main>


<footer>

    <p>
        🏏 APL Tournament Platform
    </p>

</footer>


<script
    type="module"
    src="./js/team.js?v=30"
></script>


</body>

</html>
