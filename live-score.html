<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Live Score - APL Tournament Platform</title>

<link
    rel="stylesheet"
    href="./css/style.css"
>

<style>

.live-container {
    max-width: 1000px;
    margin: auto;
}


/* ================================
   TOURNAMENT SELECTOR
================================ */

.tournament-selector {

    background: white;

    padding: 18px;

    border-radius: 16px;

    margin-bottom: 20px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}

.tournament-selector label {

    display: block;

    color: #1e3a8a;

    font-weight: bold;

    margin-bottom: 8px;

}

#tournamentSelect {

    width: 100%;

    padding: 13px;

    border: 1px solid #cbd5e1;

    border-radius: 10px;

    background: white;

    font-size: 15px;

    color: #0f172a;

    outline: none;

}

#tournamentSelect:focus {

    border-color: #2563eb;

}


/* ================================
   TOURNAMENT HEADER
================================ */

.live-header {

    background: white;

    padding: 22px;

    border-radius: 16px;

    margin-bottom: 20px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.live-header h2 {

    color: #1e3a8a;

    margin-bottom: 10px;

}


.tournament-id {

    background: #eff6ff;

    padding: 12px;

    border-radius: 8px;

    word-break: break-all;

}


.live-status {

    display: inline-block;

    background: #dc2626;

    color: white;

    padding: 7px 12px;

    border-radius: 20px;

    font-weight: bold;

    margin-top: 12px;

}


/* ================================
   MATCHES
================================ */

.matches {

    display: grid;

    gap: 15px;

}


.live-card {

    background: white;

    padding: 22px;

    border-radius: 16px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.match-number {

    color: #1d4ed8;

    font-weight: bold;

    margin-bottom: 12px;

}


.teams {

    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: center;

    gap: 10px;

    text-align: center;

    font-size: 20px;

    font-weight: bold;

}


.team-score {

    background: #f8fafc;

    padding: 15px;

    border-radius: 10px;

}


.score {

    font-size: 28px;

    margin-top: 8px;

}


.vs {

    font-size: 18px;

}


.match-info {

    margin-top: 15px;

    padding-top: 12px;

    border-top: 1px solid #e5e7eb;

    color: #64748b;

}


.result {

    margin-top: 12px;

    background: #dcfce7;

    padding: 12px;

    border-radius: 8px;

    font-weight: bold;

}


.live-badge {

    background: #dc2626;

    color: white;

    padding: 4px 8px;

    border-radius: 5px;

    font-size: 12px;

}


.completed-badge {

    background: #16a34a;

    color: white;

    padding: 4px 8px;

    border-radius: 5px;

    font-size: 12px;

}


.scheduled-badge {

    background: #64748b;

    color: white;

    padding: 4px 8px;

    border-radius: 5px;

    font-size: 12px;

}


.empty {

    background: white;

    padding: 30px;

    text-align: center;

    border-radius: 15px;

}


.navigation {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 20px;

}


.refresh-info {

    text-align: center;

    color: #64748b;

    margin: 15px 0;

}

</style>

</head>


<body>


<header class="top-header">

    <div class="logo">
        🏏
    </div>

    <div>

        <h1>
            Live Score
        </h1>

        <p>
            APL Tournament Platform
        </p>

    </div>

</header>


<main class="home-container">


<div class="live-container">


    <!-- =================================
         TOURNAMENT DROPDOWN
    ================================== -->

    <div class="tournament-selector">

        <label for="tournamentSelect">

            🏆 Select Tournament

        </label>


        <select id="tournamentSelect">

            <option value="">

                ⏳ Loading Tournaments...

            </option>

        </select>

    </div>



    <!-- =================================
         TOURNAMENT INFORMATION
    ================================== -->

    <div
        id="tournamentInfo"
        class="live-header"
    >

        ⏳ Loading Tournament...

    </div>



    <div class="refresh-info">

        🔄 Live score automatically refreshes

    </div>



    <!-- =================================
         LIVE MATCHES
    ================================== -->

    <div
        id="matchesList"
        class="matches"
    >

        <div class="empty">

            ⏳ Loading Live Matches...

        </div>

    </div>



    <!-- =================================
         NAVIGATION
    ================================== -->

    <div class="navigation">


        <a
            id="tournamentLink"
            href="#"
            class="btn"
        >

            🏆 Tournament

        </a>


        <a
            id="teamsLink"
            href="#"
            class="btn"
        >

            👥 Teams

        </a>


        <a
            id="scheduleLink"
            href="#"
            class="btn"
        >

            📅 Schedule

        </a>


        <a
            id="resultsLink"
            href="#"
            class="btn"
        >

            🏆 Results

        </a>


        <a
            id="pointsLink"
            href="#"
            class="btn"
        >

            📈 Points Table

        </a>


        <a
            href="my-tournaments.html"
            class="btn"
        >

            ⬅ My Tournaments

        </a>


    </div>


</div>


</main>


<footer>

    <p>

        🏏 APL Tournament Platform

    </p>

</footer>



<script
    type="module"
    src="./js/live-score.js?v=10"
></script>


</body>

</html>
